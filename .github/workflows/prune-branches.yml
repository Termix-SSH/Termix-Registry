name: Prune branches

# Deletes dev branches whose version is already released, and Dependabot
# copies whose dev branch is gone, in every repo the Termix CI App can reach.
# The signed commits ruleset lets only the App delete branches. Anything with
# an open PR is kept.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-24.04
    # Holds the Termix CI App key.
    environment: sync
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          # Every repo on purpose: the job cleans up all of them. Only our own
          # code from main runs here, on a schedule or by hand, no PR input.
          owner: Termix-SSH # zizmor: ignore[github-app]
          permission-contents: write
          permission-pull-requests: read

      - name: Prune
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/prune-branches/run.mjs
