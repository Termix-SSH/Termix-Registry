name: Release Plugin

# Releases official plugins. Run by hand from main with one plugin id or a
# comma list. Each plugin releases from its only dev-X.Y.Z branch (or the
# branch you name when releasing one plugin).
#
# Releases are immutable. Each one is made as a draft, gets its files, then
# is published. A version that already has a release can't be run again:
# bump the version on the dev branch.
#
# The signing key, the Termix CI App key and the LLM key live only in this
# repo's environments. Plugin repos hold no secrets. One approval of the
# release environment covers every plugin in the run.

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Plugin ids, comma separated (ssh-terminal, docker)"
        required: true
        type: string
      channel:
        description: "Stable release or beta"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      mode:
        description: "release or dry-run"
        required: true
        default: release
        type: choice
        options:
          - release
          - dry-run
      ref:
        description: "Branch to release from (one plugin only, optional)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --ignore-scripts

      - name: Pick plugins and commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGINS: ${{ inputs.plugins }}
          REF: ${{ inputs.ref }}
        run: node scripts/release/plan.mjs --plugins "$PLUGINS" --ref "$REF"

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-plugin-one.yml
    with:
      id: ${{ matrix.id }}
      repo: ${{ matrix.repo }}
      name: ${{ matrix.name }}
      branch: ${{ matrix.branch }}
      sha: ${{ matrix.sha }}
      channel: ${{ inputs.channel }}
      mode: ${{ inputs.mode }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # The values come from the environments of the jobs that read them.
    secrets:
      TERMIX_LLM_API_KEY: ${{ secrets.TERMIX_LLM_API_KEY }}
      TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
      TERMIX_PLUGIN_ONLINE_KEY: ${{ secrets.TERMIX_PLUGIN_ONLINE_KEY }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Starts the index sync once, after every plugin of the run.
  sync:
    needs: release
    if: ${{ always() && inputs.mode != 'dry-run' && needs.release.result != 'skipped' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: write
    steps:
      - name: Start the registry sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main
