name: Plugin CI

# Called by a plugin repo's ci.yml on pushes and pull requests.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Test
        run: npx termix-plugin test

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Build
        run: npx termix-plugin build

      - name: Validate
        run: npx termix-plugin validate

      - name: Pack
        run: npx termix-plugin pack --out release
