name: Check submission

on:
  pull_request:
    paths:
      - "community/plugins/**"

permissions: {}

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      rebuilds: ${{ steps.check.outputs.rebuilds }}
    steps:
      # The checks run from the base branch and only read the PR's files as
      # data, so a PR can't change what checks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check the submission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: FETCH_HEAD
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: npm run check:submission

  # Each new version must rebuild from its tag to the same file. From main,
  # so a PR can't change the check.
  reproduce:
    needs: check
    if: ${{ needs.check.outputs.rebuilds != '' && needs.check.outputs.rebuilds != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.rebuilds) }}
    uses: Termix-SSH/Termix-Registry/.github/workflows/reproduce.yml@main
    with:
      repo: ${{ matrix.repo }}
      tag: ${{ matrix.tag }}
      record: false
    permissions:
      contents: read
