name: Sync

on:
  repository_dispatch:
    types: [plugin-released]
  # A merged community submission lists right away.
  push:
    branches: [main]
    paths:
      - "community/plugins/**"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

# The sync rebuilds the index from every release, so a queued run that
# replaces another one loses nothing.
concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: sync
    steps:
      # Main is protected, so the push goes through the Termix CI App.
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix-Registry,Docs
          permission-contents: write

      # A queued run must start from the index the last run pushed, not the
      # commit it was triggered on.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # No cache and no install scripts in a job that holds a signing key.
      - run: npm ci --ignore-scripts

      # A release that fails its checks is left out and fails the run at
      # the end, but the rest of the index still gets committed.
      - name: Sync releases into the index
        id: sync
        continue-on-error: true
        env:
          # The App token has 5000 calls an hour; the job token only 1000,
          # which a batch of video runs used up.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TERMIX_COMMUNITY_SIGNING_KEY: ${{ secrets.TERMIX_COMMUNITY_SIGNING_KEY }}
        run: npm run sync

      - name: Validate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: npm run validate

      - name: Commit
        id: commit
        run: |
          if git diff --quiet; then
            echo "Index is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official/index.json community/index.json
          git commit -m "chore: sync plugin releases"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The docs site pulls each plugin's docs from its release, so it
      # rebuilds whenever the index changes.
      - name: Tell the docs site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/Termix-SSH/Docs/dispatches -f event_type=registry-updated

      - name: Report releases that were left out
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Some releases failed their checks, see the sync step."
          exit 1
