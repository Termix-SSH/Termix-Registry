name: Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

# Pushes go through the App token, the job token only reads.
permissions: {}

concurrency:
  group: registry-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: sync
    permissions:
      contents: read
    steps:
      # Main is protected, so the push goes through the Termix CI App.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix-Registry
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          # The commit step pushes with it.
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --ignore-scripts

      # A plugin whose releases cannot be read keeps the rest committed.
      - name: Count downloads
        id: stats
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run stats

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- '*/stats.json')" ]; then
            echo "Stats are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/stats.json'
          git commit -m "chore: update plugin stats"
          git pull --rebase origin main
          git push

      - name: Report problems
        if: steps.stats.outcome == 'failure'
        run: |
          echo "Some counts could not be read, see the stats step."
          exit 1
