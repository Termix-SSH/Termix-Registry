name: Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: registry-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: sync
    steps:
      # Main is protected, so the push goes through the Termix CI App.
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix-Registry
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --ignore-scripts

      # A plugin whose releases cannot be read keeps the rest committed.
      - name: Count downloads
        id: stats
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run stats

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- '*/stats.json')" ]; then
            echo "Stats are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/stats.json'
          git commit -m "chore: update plugin stats"
          git pull --rebase origin main
          git push

      - name: Report problems
        if: steps.stats.outcome == 'failure'
        run: |
          echo "Some counts could not be read, see the stats step."
          exit 1
