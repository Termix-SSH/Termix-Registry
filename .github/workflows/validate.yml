name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate every index
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run validate

      - name: Tests (translator, release scripts, workflow secrets)
        run: npm test

  supply-chain:
    name: Supply chain
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # The shared action from this checkout, so a change to it is tested here.
      - name: Registry lockfile
        uses: ./.github/actions/supply-chain

      - name: Action lockfile
        uses: ./.github/actions/supply-chain
        with:
          directory: .github/actions/supply-chain
