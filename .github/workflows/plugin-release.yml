name: Plugin Release

# Called by a plugin repo's release.yml, run by hand from a dev-X.Y.Z branch.
#
# stable: stamps X.Y.Z, commits it to the dev branch, squash merges the dev
#   branch into main, tags vX.Y.Z there, releases it, deletes the dev branch
#   and this version's beta releases (their tags stay).
# beta: stamps X.Y.Z-beta.N into the build only, tags the dev commit and
#   publishes a GitHub prerelease. The registry lists it under prereleases,
#   so only plugins on the beta channel are offered it.
# dry-run: everything up to pack, nothing is pushed or published.
#
# Releases are immutable once published. The release is made as a draft with
# its files, then published, which creates the tag. A version that already
# has a release or tag is refused: bump the version.
#
# This is for community plugins. They need no secrets: the release gets
# GitHub build provenance, and the job summary shows what to put in a
# community registry submission. Their release.yml must grant id-token: write
# and attestations: write for that. Optional secrets in the plugin's own repo:
# TERMIX_PAT to push workflow file changes to main, TERMIX_PLUGIN_SIGNING_KEY
# to also sign with the author's own key.
#
# Official Termix-SSH plugins are released from this repo's Release Plugin
# workflow (release-plugin.yml), which keeps the signing key out of plugin
# repos. This workflow refuses them.

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      mode:
        type: string
        default: release
    secrets:
      TERMIX_PAT:
        required: false
      TERMIX_PLUGIN_SIGNING_KEY:
        required: false

permissions: {}

concurrency:
  group: plugin-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The caller grants these too. Provenance needs the last two.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY != '' }}
    steps:
      - name: Official plugins release from Termix-Registry
        if: ${{ github.repository_owner == 'Termix-SSH' }}
        run: |
          echo "Official plugins are released from Termix-SSH/Termix-Registry with the Release Plugin workflow."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.TERMIX_PAT || github.token }}
          # The merge, tag and release steps push with it.
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Lockfile lint and install
        uses: Termix-SSH/Termix-Registry/.github/actions/supply-chain@main
        with:
          osv: "false"
          install: "true"

      - name: Resolve the version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$CHANNEL" in stable|beta) ;; *) echo "channel must be stable or beta"; exit 1 ;; esac
          case "$MODE" in release|dry-run) ;; *) echo "mode must be release or dry-run"; exit 1 ;; esac

          base=$(printf '%s' "$GITHUB_REF_NAME" | sed -nE 's/^dev-([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          if [ -z "$base" ]; then
            echo "Run this from a dev-X.Y.Z branch (got $GITHUB_REF_NAME)."
            exit 1
          fi
          if [ "$CHANNEL" = "beta" ]; then
            last=$(git tag -l "v$base-beta.*" | sed -E "s/^v$base-beta\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            version="$base-beta.$(( ${last:-0} + 1 ))"
          else
            version="$base"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
            || gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released and a release can't change. Bump the version on the dev branch."
            exit 1
          fi

          prev=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$version" | head -1)
          echo "Releasing $version ($CHANNEL, $MODE), changes since ${prev:-the start}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prev=$prev"
            echo "base=${base:-$version}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # the quoted text is JavaScript
          node -e '
            const fs = require("fs");
            // Swap only the version string so the file keeps its prettier formatting.
            for (const file of ["manifest.json", "package.json"]) {
              const text = fs.readFileSync(file, "utf8");
              const next = text.replace(/^(\s{2}"version":\s*")[^"]*(")/m, `$1${process.env.VERSION}$2`);
              if (JSON.parse(next).version !== process.env.VERSION) {
                console.error(`Could not stamp the version in ${file}`);
                process.exit(1);
              }
              fs.writeFileSync(file, next);
            }
            // Stamp the lock by hand. Re-resolving it on the runner npm drops bundled deps.
            if (fs.existsSync("package-lock.json")) {
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              lock.version = process.env.VERSION;
              if (lock.packages && lock.packages[""]) lock.packages[""].version = process.env.VERSION;
              fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            }
          '

      # A beta's notes come from git. Writing them into CHANGELOG.md for the
      # build gives validate the heading it wants and puts them in the
      # .tmxplug. Betas never commit, so the file in git stays as it was.
      - name: Beta changelog section
        if: ${{ inputs.channel == 'beta' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          [ -f CHANGELOG.md ] || exit 0
          # Translations are committed after the build, so a rebuild from the
          # tag would list that commit too.
          locales=$(node -p "require('./manifest.json').locales || 'locales'")
          {
            echo "## $VERSION"
            echo
            echo "### Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --format='- %s' "$PREV..HEAD" -- . ':!package-lock.json' ":!$locales/translated" | head -100
            fi
            echo "- Beta build"
            echo
          } > "$RUNNER_TEMP/beta.md"
          # shellcheck disable=SC2016 # the quoted text is JavaScript
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const section = fs.readFileSync(process.argv[1], "utf8");
            const at = text.search(/^## /m);
            fs.writeFileSync(
              "CHANGELOG.md",
              at < 0 ? `${text.trimEnd()}\n\n${section}` : text.slice(0, at) + section + text.slice(at),
            );
          ' "$RUNNER_TEMP/beta.md"

      - name: Find locales
        id: locales
        run: |
          dir=$(node -p "require('./manifest.json').locales || 'locales'")
          if [ -f "$dir/en.json" ]; then echo "dir=$dir" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        run: npx termix-plugin test

      - name: Type-check
        run: npm run typecheck --if-present

      # The plugin's own build script, so a plugin can add steps after
      # termix-plugin build (like vendoring a file into dist). Plugins without
      # one get the plain SDK build.
      - name: Build
        run: |
          if [ "$(npm pkg get scripts.build)" != "{}" ]; then
            npm run build
          else
            npx termix-plugin build
          fi

      - name: Validate
        run: npx termix-plugin validate

      - name: Pack
        run: npx termix-plugin pack --out release

      - name: Sign with the author's key
        if: ${{ inputs.mode != 'dry-run' && env.HAS_SIGNING_KEY == 'true' }}
        env:
          TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
        run: npx termix-plugin sign release/*.tmxplug

      - name: Build provenance
        if: ${{ inputs.mode != 'dry-run' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tmxplug

      - name: Release notes
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            {
              echo "> [!WARNING]"
              echo "> This is a beta. It can have bugs. In Termix, open this plugin and press Back to stable to go back."
              echo
              echo "Found a bug or have feedback? [Send beta feedback](https://github.com/$GITHUB_REPOSITORY/issues/new?template=beta_feedback.yml&plugin-version=$VERSION)."
              echo
              echo "### Changes"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --format='- %s' "$PREV..HEAD" -- . ':!package-lock.json' | head -100
              else
                echo "- First release"
              fi
            } > RELEASE_NOTES.md
          elif [ -f CHANGELOG.md ]; then
            npx termix-plugin changelog --version "$VERSION" > RELEASE_NOTES.md
          else
            echo "No CHANGELOG.md, so this release has no notes." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Commit the version and merge into main
        id: merge
        if: ${{ inputs.mode == 'release' && inputs.channel == 'stable' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LOCALES: ${{ steps.locales.outputs.dir }}
          # npm ci installs the repo's git hooks. lint-staged can turn a
          # lockfile-only commit into an empty one and fail it.
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json
          if [ -n "$LOCALES" ]; then git add "$LOCALES"; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          # main only ever takes dev branches, so it gets the dev tree as one commit.
          dev_sha=$(git rev-parse HEAD)
          git fetch origin main
          git checkout -B main origin/main
          git read-tree -u --reset "$dev_sha"
          if git diff --cached --quiet; then
            echo "main already matches $GITHUB_REF_NAME"
          else
            git commit -m "feat: release $VERSION"
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only the locales are committed. The stamped version and beta changelog
      # stay out of git, as before.
      - name: Commit translations (beta)
        id: translations
        if: ${{ inputs.mode == 'release' && inputs.channel == 'beta' && steps.locales.outputs.dir != '' }}
        env:
          LOCALES: ${{ steps.locales.outputs.dir }}
          HUSKY: "0"
        run: |
          git add "$LOCALES"
          if git diff --cached --quiet; then
            echo "No translation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update translations"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.merge.outputs.sha || steps.translations.outputs.sha || github.sha }}
          PRERELEASE: ${{ inputs.channel == 'beta' && 'true' || 'false' }}
        run: |
          files=(release/*.tmxplug)
          if compgen -G "release/*.tmxplug.sig" > /dev/null; then
            files+=(release/*.tmxplug.sig)
          fi
          # Draft first, so nobody sees it before every file is on it.
          gh release create "$TAG" "${files[@]}" \
            --draft --title "$TAG" --target "$TARGET" --notes-file RELEASE_NOTES.md
          rid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id' | head -1)
          [ -n "$rid" ] || { echo "No draft found for $TAG."; exit 1; }
          # Publishing creates the tag at the final commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" \
            -F draft=false -F prerelease="$PRERELEASE" -f target_commitish="$TARGET" > /dev/null
          echo "Published $TAG."

      - name: Clean up after a stable release
        if: ${{ inputs.mode == 'release' && inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "v$BASE-beta." | while read -r TAG; do
              echo "Deleting release $TAG"
              gh release delete "$TAG" --yes || true
            done
          git push origin --delete "$GITHUB_REF_NAME" || true

      - name: Community registry submission
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          id=$(node -p "require('./manifest.json').id")
          hash=$(sha256sum release/*.tmxplug | cut -d' ' -f1)
          guide="https://github.com/Termix-SSH/Termix-Registry/blob/main/CONTRIBUTING.md"
          {
            echo "## Community registry"
            echo
            echo "To list this version, add it to the top of versions in community/plugins/$id.json in Termix-Registry and open a pull request. See [submitting a plugin]($guide)."
            echo
            echo '```json'
            echo "{ \"version\": \"$VERSION\", \"sha256\": \"$hash\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
