name: Plugin Release

# Called by a plugin repo's release.yml, run by hand from a dev-X.Y.Z branch.
#
# stable: stamps X.Y.Z, commits it to the dev branch, squash merges the dev
#   branch into main, tags vX.Y.Z there, releases it, deletes the dev branch
#   and this version's beta releases (their tags stay).
# beta: stamps X.Y.Z-beta.N into the build only, tags the dev commit and
#   publishes a GitHub prerelease. The registry lists it under prereleases,
#   so only plugins on the beta channel are offered it.
# overwrite: releases the manifest version again from the current commit,
#   replacing its files. Works from any branch.
# dry-run: everything up to pack, nothing is pushed or published.
#
# Plugins outside Termix-SSH need no secrets. Their release is not signed,
# it gets GitHub build provenance instead, and the job summary shows what to
# put in a community registry submission. Their release.yml must grant
# id-token: write and attestations: write for that.

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      mode:
        type: string
        default: release
    secrets:
      TERMIX_PLUGIN_SIGNING_KEY:
        required: false
      TERMIX_PAT:
        required: false

# No permissions block on purpose: the job keeps what the caller grants, so
# community plugins can add the ones build provenance needs.

concurrency:
  group: plugin-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ github.repository_owner == 'Termix-SSH' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    env:
      OFFICIAL: ${{ github.repository_owner == 'Termix-SSH' }}
      HAS_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TERMIX_PAT || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Resolve the version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$CHANNEL" in stable|beta) ;; *) echo "channel must be stable or beta"; exit 1 ;; esac
          case "$MODE" in release|overwrite|dry-run) ;; *) echo "mode must be release, overwrite or dry-run"; exit 1 ;; esac

          if [ "$MODE" = "overwrite" ]; then
            if [ "$CHANNEL" = "beta" ]; then
              echo "overwrite re-releases a stable version, run it with channel stable"
              exit 1
            fi
            version=$(node -p "require('./manifest.json').version")
          else
            base=$(printf '%s' "$GITHUB_REF_NAME" | sed -nE 's/^dev-([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            if [ -z "$base" ]; then
              echo "Run this from a dev-X.Y.Z branch (got $GITHUB_REF_NAME)."
              exit 1
            fi
            if [ "$CHANNEL" = "beta" ]; then
              last=$(git tag -l "v$base-beta.*" | sed -E "s/^v$base-beta\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
              version="$base-beta.$(( ${last:-0} + 1 ))"
            else
              version="$base"
              if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
                echo "v$version is already released. Bump the dev branch or use mode overwrite."
                exit 1
              fi
            fi
          fi

          prev=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$version" | head -1)
          echo "Releasing $version ($CHANNEL, $MODE), changes since ${prev:-the start}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "base=${base:-$version}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["manifest.json", "package.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > /dev/null

      # A beta's notes come from git. Writing them into CHANGELOG.md for the
      # build gives validate the heading it wants and puts them in the
      # .tmxplug. Betas never commit, so the file in git stays as it was.
      - name: Beta changelog section
        if: ${{ inputs.channel == 'beta' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          [ -f CHANGELOG.md ] || exit 0
          {
            echo "## $VERSION"
            echo
            echo "### Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --format='- %s' "$PREV..HEAD" -- . ':!package-lock.json' | head -100
            fi
            echo "- Beta build"
            echo
          } > "$RUNNER_TEMP/beta.md"
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const section = fs.readFileSync(process.argv[1], "utf8");
            const at = text.search(/^## /m);
            fs.writeFileSync(
              "CHANGELOG.md",
              at < 0 ? `${text.trimEnd()}\n\n${section}` : text.slice(0, at) + section + text.slice(at),
            );
          ' "$RUNNER_TEMP/beta.md"

      - name: Test
        run: npx termix-plugin test

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Build
        run: npx termix-plugin build

      - name: Validate
        run: npx termix-plugin validate

      - name: Pack
        run: npx termix-plugin pack --out release

      - name: Sign
        # Official plugins must be signed, so a missing key fails here.
        if: ${{ inputs.mode != 'dry-run' && (env.OFFICIAL == 'true' || env.HAS_SIGNING_KEY == 'true') }}
        env:
          TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
        run: npx termix-plugin sign release/*.tmxplug

      - name: Build provenance
        if: ${{ inputs.mode != 'dry-run' && env.OFFICIAL != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.tmxplug

      - name: Release notes
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            {
              echo "> [!WARNING]"
              echo "> This is a beta. It can have bugs. In Termix, open this plugin and press Back to stable to go back."
              echo
              echo "Found a bug or have feedback? [Send beta feedback](https://github.com/$GITHUB_REPOSITORY/issues/new?template=beta_feedback.yml&plugin-version=$VERSION)."
              echo
              echo "### Changes"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --format='- %s' "$PREV..HEAD" -- . ':!package-lock.json' | head -100
              else
                echo "- First release"
              fi
            } > RELEASE_NOTES.md
          elif [ -f CHANGELOG.md ]; then
            npx termix-plugin changelog --version "$VERSION" > RELEASE_NOTES.md
          else
            echo "No CHANGELOG.md, so this release has no notes." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Commit the version and merge into main
        id: merge
        if: ${{ inputs.mode == 'release' && inputs.channel == 'stable' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # npm ci installs the repo's git hooks. lint-staged can turn a
          # lockfile-only commit into an empty one and fail it.
          HUSKY: "0"
        run: |
          if [ "$OFFICIAL" = "true" ]; then
            git config user.name "LukeGus"
            git config user.email "bugattiguy527@gmail.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add manifest.json package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          # main only ever takes dev branches, so it gets the dev tree as one commit.
          dev_sha=$(git rev-parse HEAD)
          git fetch origin main
          git checkout -B main origin/main
          git read-tree -u --reset "$dev_sha"
          if git diff --cached --quiet; then
            echo "main already matches $GITHUB_REF_NAME"
          else
            git commit -m "feat: release $VERSION"
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.merge.outputs.sha || github.sha }}
        run: |
          git tag -f "$TAG" "$TARGET"
          git push -f origin "refs/tags/$TAG"

      - name: GitHub release
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.merge.outputs.sha || github.sha }}
          PRERELEASE: ${{ inputs.channel == 'beta' && '--prerelease' || '' }}
        run: |
          files=(release/*.tmxplug)
          if compgen -G "release/*.tmxplug.sig" > /dev/null; then
            files+=(release/*.tmxplug.sig)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md $PRERELEASE
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" --target "$TARGET" --notes-file RELEASE_NOTES.md $PRERELEASE
          fi

      - name: Clean up after a stable release
        if: ${{ inputs.mode == 'release' && inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "v$BASE-beta." | while read -r TAG; do
              echo "Deleting release $TAG"
              gh release delete "$TAG" --yes || true
            done
          git push origin --delete "$GITHUB_REF_NAME" || true

      - name: Tell the registry
        if: ${{ inputs.mode != 'dry-run' && env.OFFICIAL == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TERMIX_PAT }}
        run: |
          gh api repos/Termix-SSH/Termix-Registry/dispatches \
            -f event_type=plugin-released \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"

      - name: Community registry submission
        if: ${{ inputs.mode != 'dry-run' && env.OFFICIAL != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          id=$(node -p "require('./manifest.json').id")
          hash=$(sha256sum release/*.tmxplug | cut -d' ' -f1)
          guide="https://github.com/Termix-SSH/Termix-Registry/blob/main/CONTRIBUTING.md"
          {
            echo "## Community registry"
            echo
            echo "To list this version, add it to the top of versions in community/plugins/$id.json in Termix-Registry and open a pull request. See [submitting a plugin]($guide)."
            echo
            echo '```json'
            echo "{ \"version\": \"$VERSION\", \"sha256\": \"$hash\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
